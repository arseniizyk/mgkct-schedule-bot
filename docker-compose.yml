services:
    nats:
        image: nats
        ports:
            - '4223:4222'
            - '8222:8222' # мониторинг
        command: '-DV -m 8222'
        restart: unless-stopped
        networks:
            - internal

    tg-bot:
        build:
            context: .
            dockerfile: services/tg-bot/Dockerfile
            target: tg-bot
        container_name: tg-bot
        command: ./tg-bot
        env_file: ./configs/.env
        depends_on:
            nats:
                condition: service_started
            tg-bot-postgres:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:8081/healthz']
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 15s
        restart: unless-stopped
        networks:
            - internal

    scraper:
        build:
            context: .
            dockerfile: services/scraper/Dockerfile
            target: scraper
        container_name: scraper
        command: ./scraper
        env_file: ./configs/.env
        depends_on:
            nats:
                condition: service_started
            scraper-postgres:
                condition: service_healthy
        healthcheck:
            test: ['CMD', '/usr/local/bin/grpc_health_probe', '-addr=:9001']
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 15s
        restart: unless-stopped
        ports:
            - '9001:9001'
        networks:
            - internal

    scraper-postgres:
        image: postgres:18
        container_name: scraper-postgres
        restart: unless-stopped
        env_file: ./configs/.env
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${SCRAPER_DB_USER} -d ${SCRAPER_DB_NAME}',
                ]
            interval: 3s
            timeout: 3s
            retries: 5
        volumes:
            - scraper-postgres:/var/lib/postgresql
        networks:
            - internal
        environment:
            POSTGRES_USER: ${SCRAPER_DB_USER}
            POSTGRES_PASSWORD: ${SCRAPER_DB_PASSWORD}
            POSTGRES_DB: ${SCRAPER_DB_NAME}

    tg-bot-postgres:
        image: postgres:18
        container_name: tg-bot-postgres
        restart: unless-stopped
        env_file: ./configs/.env
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U ${BOT_DB_USER} -d ${BOT_DB_NAME}']
            interval: 3s
            timeout: 3s
            retries: 5
        volumes:
            - tg-bot-postgres:/var/lib/postgresql
        networks:
            - internal
        environment:
            POSTGRES_USER: ${BOT_DB_USER}
            POSTGRES_PASSWORD: ${BOT_DB_PASSWORD}
            POSTGRES_DB: ${BOT_DB_NAME}

    adminer:
        image: adminer
        restart: unless-stopped
        ports:
            - '8080:8080'
        environment:
            - ADMINER_DEFAULT_SERVER=scraper-postgres
        networks:
            - internal

volumes:
    tg-bot-postgres:
    scraper-postgres:

networks:
    internal:
