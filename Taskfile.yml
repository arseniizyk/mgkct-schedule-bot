version: '3'

vars:
  GOLANGCI_LINT_VERSION: 'v2.13.1'
  BUF_VERSION: 'v1.72.0'
  PROTOC_GEN_GO_VERSION: 'v1.36.12'
  PROTOC_GEN_GO_GRPC_VERSION: 'v1.6.2'
  GOFUMPT_VERSION: 'v0.10.0'
  GCI_VERSION: 'v0.14.0'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  BIN_EXT: '{{if eq OS "windows"}}.exe{{end}}' # shit for windows
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint{{.BIN_EXT}}'
  BUF: '{{.BIN_DIR}}/buf{{.BIN_EXT}}'
  PROTOC_GEN_GO: '{{.BIN_DIR}}/protoc-gen-go{{.BIN_EXT}}'
  PROTOC_GEN_GO_GRPC: '{{.BIN_DIR}}/protoc-gen-go-grpc{{.BIN_EXT}}'
  GCI: '{{.BIN_DIR}}/gci{{.BIN_EXT}}'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt{{.BIN_EXT}}'

includes:
  scraper: ./services/scraper
  tg-bot: ./services/tg-bot
  proto: ./proto

tasks:
  tidy:
    deps:
      - scraper:tidy
      - tg-bot:tidy

  up:
    desc: Поднимает весь стек (docker compose up --build)
    cmd: docker compose --env-file=./configs/.env up --build -d

  down:
    desc: Останавливает стек и удаляет volumes
    cmd: docker compose --env-file=./configs/.env down -v

  deps:tidy:
    desc: go mod tidy во всех модулях
    cmds:
      - go -C services/scraper mod tidy
      - go -C services/tg-bot mod tidy
      - go -C libs/config mod tidy
      - go -C proto mod tidy

  test:
    desc: Unit-тесты всех модулей
    cmds:
      - task: scraper:test
      - task: tg-bot:test

  test-integration:
    desc: Интеграционные тесты сервисов (нужен запущенный Docker)
    cmds:
      - task: scraper:test:integration
      - task: tg-bot:test:integration

  format:
    desc: Форматирует все модули
    deps:
      - scraper:format
      - tg-bot:format

  lint:
    desc: Линтим все модули (последовательно — golangci-lint не любит параллельный запуск)
    cmds:
      - task: scraper:lint
      - task: tg-bot:lint

  lint:fix:
    desc: Фиксит golangci-lint во всех модулях
    cmds:
      - task: scraper:lint:fix
      - task: tg-bot:lint:fix

  install-golangci-lint:
    desc: Устанавливает golangci-lint в каталог bin
    status:
      - test -f {{.GOLANGCI_LINT}}
    cmds:
      - |
        echo "📦 Устанавливаем golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
        GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}

  install-buf:
    desc: Устанавливает buf в каталог bin
    status:
      - test -f {{.BUF}}
    cmds:
      - |
        echo "📦 Устанавливаем buf {{.BUF_VERSION}}..."
        GOBIN={{.BIN_DIR}} go install github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}}

  install-protoc-plugins:
    desc: Устанавливает protoc-gen-go и protoc-gen-go-grpc в каталог bin
    status:
      - test -f {{.PROTOC_GEN_GO}}
      - test -f {{.PROTOC_GEN_GO_GRPC}}
    cmds:
      - |
        echo "📦 Устанавливаем protoc-gen-go {{.PROTOC_GEN_GO_VERSION}}..."
        GOBIN={{.BIN_DIR}} go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
        echo "📦 Устанавливаем protoc-gen-go-grpc {{.PROTOC_GEN_GO_GRPC_VERSION}}..."
        GOBIN={{.BIN_DIR}} go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@{{.PROTOC_GEN_GO_GRPC_VERSION}}

  install-formatters:
    desc: "Устанавливает форматтеры gci и gofumpt в ./bin"
    cmds:
      - |
        [ -f {{.GOFUMPT}} ] || {
          echo '📦 Устанавливаем gofumpt {{.GOFUMPT_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          echo '📦 Устанавливаем gci {{.GCI_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}
