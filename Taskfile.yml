version: '3'

vars:
  GOLANGCI_LINT_VERSION: 'v2.14.0'
  GOFUMPT_VERSION: 'v0.12.0'
  GCI_VERSION: 'v0.14.0'
  BIN_DIR: '{{.ROOT_DIR}}/bin'
  BIN_EXT: '{{if eq OS "windows"}}.exe{{end}}'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint{{.BIN_EXT}}'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt{{.BIN_EXT}}'
  GCI: '{{.BIN_DIR}}/gci{{.BIN_EXT}}'
  MOCKERY: '{{.BIN_DIR}}/mockery{{.BIN_EXT}}'

tasks:
  build:
    desc: Сборка бинарника бота
    cmds:
      - go build -o bin/bot ./cmd/bot

  run:
    desc: Запуск бота локально
    cmds:
      - go run ./cmd/bot

  tidy:
    desc: Очистка и обновление зависимостей
    cmds:
      - go mod tidy

  mock:
    desc: Генерация моков через mockery
    cmds:
      - '{{.MOCKERY}}'

  test:
    desc: Запуск модульных тестов
    cmds:
      - go test -v -race ./internal/...

  install-formatters:
    desc: Устанавливает форматтеры gofumpt и gci в каталог bin
    status:
      - test -f {{.GOFUMPT}}
      - test -f {{.GCI}}
    cmds:
      - |
        echo "📦 Устанавливаем gofumpt {{.GOFUMPT_VERSION}}..."
        CGO_ENABLED=0 GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        echo "📦 Устанавливаем gci {{.GCI_VERSION}}..."
        CGO_ENABLED=0 GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}

  format:
    desc: Форматирование кода (gofumpt + gci + golangci-lint fmt)
    deps:
      - install-formatters
      - install-golangci-lint
    cmds:
      - '{{.GOFUMPT}} -extra -w .'
      - '{{.GCI}} write -s standard -s default -s "prefix(github.com/arseniizyk/mgkct-schedule-bot)" .'
      - '{{.GOLANGCI_LINT}} fmt'

  install-golangci-lint:
    desc: Устанавливает golangci-lint в каталог bin
    status:
      - test -f {{.GOLANGCI_LINT}}
    cmds:
      - |
        echo "📦 Устанавливаем golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
        CGO_ENABLED=0 GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}

  lint:
    desc: Проверка линтером golangci-lint
    deps:
      - install-golangci-lint
    cmds:
      - '{{.GOLANGCI_LINT}} run ./...'

  lint:fix:
    desc: Автоматическое исправление замечаний линтера
    deps:
      - format
      - install-golangci-lint
    cmds:
      - '{{.GOLANGCI_LINT}} run --fix ./...'

  up:
    desc: Запуск в Docker Compose
    cmds:
      - docker compose --env-file=./configs/.env up --build -d

  down:
    desc: Остановка Docker Compose
    cmds:
      - docker compose down -v
