version: '3'

vars:
    BIN_EXT: '{{if eq OS "windows"}}.exe{{end}}' # shit for windows

tasks:
    tidy:
        desc: go mod tidy
        cmds:
            - go mod tidy

    build:
        desc: Собирает libs/config
        dir: '{{.TASKFILE_DIR}}'
        cmds:
            - go build ./...

    vet:
        desc: go vet libs/config
        dir: '{{.TASKFILE_DIR}}'
        cmds:
            - go vet ./...

    test:
        desc: Unit-тесты libs/config
        dir: '{{.TASKFILE_DIR}}'
        cmds:
            - go test ./...

    format:
        desc: Форматирует libs/config
        dir: '{{.TASKFILE_DIR}}'
        deps: [':install-golangci-lint']
        cmds:
            - '"{{.ROOT_DIR}}/bin/golangci-lint{{.BIN_EXT}}" fmt --config={{.ROOT_DIR}}/.golangci.yml'

    lint:
        desc: Линтим libs/config
        dir: '{{.TASKFILE_DIR}}'
        deps: [':install-golangci-lint']
        cmds:
            - '"{{.ROOT_DIR}}/bin/golangci-lint{{.BIN_EXT}}" run ./... --config={{.ROOT_DIR}}/.golangci.yml'

    lint:fix:
        desc: Фиксит golangci-lint в libs/config
        dir: '{{.TASKFILE_DIR}}'
        deps: [':install-golangci-lint']
        cmds:
            - '"{{.ROOT_DIR}}/bin/golangci-lint{{.BIN_EXT}}" run ./... --fix --config={{.ROOT_DIR}}/.golangci.yml'
