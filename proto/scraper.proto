syntax = "proto3";

// Генерация: из корня репозитория — `task proto:gen`
// (вручную: buf + protoc-gen-go + protoc-gen-go-grpc в PATH,
// затем `buf generate` из каталога proto/).

package scraper;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/arseniizyk/mgkct-schedule-bot/libs/proto;pb";

service ScheduleService {
    rpc GetGroupSchedule(GroupScheduleRequest) returns (GroupScheduleResponse);
    rpc GetGroupScheduleByWeek(GroupScheduleRequest) returns (GroupScheduleResponse);
    rpc GetAvailableWeeks(AvailableWeeksRequest) returns (AvailableWeeksResponse);

    rpc GetTeacherSchedule(TeacherScheduleRequest) returns (TeacherScheduleResponse);
    rpc GetTeacherScheduleByWeek(TeacherScheduleRequest) returns (TeacherScheduleResponse);
    rpc GetAvailableTeacherWeeks(AvailableWeeksRequest) returns (AvailableWeeksResponse);
    rpc GetTeacherNames(Empty) returns (TeacherNamesResponse);
}

message AvailableWeeksRequest{
    optional google.protobuf.Timestamp week = 1;
}

message AvailableWeeksResponse{
    optional google.protobuf.Timestamp next = 1;
    google.protobuf.Timestamp current = 2;
    google.protobuf.Timestamp prev = 3;
}

message GroupScheduleRequest {
    int32 id = 1;
    optional google.protobuf.Timestamp week = 2;
}

message GroupScheduleResponse {
    Group group = 1;
}

message Schedule {
    map<int32, Group> groups = 1;
}

message Group {
    int32 id = 1;
    google.protobuf.Timestamp week = 2;
    repeated Day days = 3;
}

message Day {
    string name = 1;
    repeated Subject subjects = 2;
}

message Subject {
    repeated Pair pairs = 1;
    bool is_empty = 2;
}

message Pair {
    string name = 1;
    string type = 2;
    // group — номер группы, к которой относится пара. Раньше поле называлось
    // teacher, хотя хранило номер группы (перегрузка смысла).
    string group = 3;
    string class = 4;
}

message Empty {}

message TeacherScheduleRequest {
    string name = 1;
    optional google.protobuf.Timestamp week = 2;
}

message TeacherScheduleResponse {
    Teacher teacher = 1;
}

message Teacher {
    string name = 1;
    google.protobuf.Timestamp week = 2;
    repeated Day days = 3;
}

message TeacherNamesResponse {
    repeated string names = 1;
}
