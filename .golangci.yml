version: "2"

run:
    timeout: 5m

linters:
    default: standard
    enable:
        - copyloopvar
        - misspell
        - predeclared
        - revive
        - unconvert
        - unparam
    settings:
        revive:
            rules:
                - name: blank-imports
                - name: context-as-argument
                - name: context-keys-type
                - name: dot-imports
                - name: error-naming
                - name: error-return
                - name: error-strings
                - name: errorf
                - name: increment-decrement
                - name: indent-error-flow
                - name: range
                - name: receiver-naming
                - name: redefines-builtin-id
                - name: superfluous-else
                - name: time-naming
                - name: unexported-return
                - name: unreachable-code
                - name: unused-parameter
                - name: useless-break
                - name: var-declaration
                - name: var-naming

formatters:
    enable:
        - goimports
